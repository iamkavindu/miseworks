spring:
  application:
    name: staff-bff
  security:
    oauth2:
      client:
        registration:
          cognito:
            client-id: ${COGNITO_CLIENT_ID}
            client-secret: ${COGNITO_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          cognito:
            issuer-uri: ${COGNITO_ISSUER_URI}
  data:
    redis:
      host: ${VALKEY_HOST}
      port: ${VALKEY_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  session:
    timeout: 30m
    redis:
      namespace: miseworks:staff-bff:sessions
server:
  port: 8081
  servlet:
    session:
      cookie:
        name: MISEWORKS_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /
miseworks:
  security:
    absolute-session-timeout: 8h
    provider-logout-uri: ${COGNITO_LOGOUT_URI}
    logout-redirect-uri: ${BFF_LOGOUT_REDIRECT_URI}
